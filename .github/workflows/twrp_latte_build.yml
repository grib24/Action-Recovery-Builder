name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        type: choice
        description: Manifest Branch
        options:
        - 16.0
        - 14.1
        - 14.0
        - 12.1
        - 11
        - 9.0
        - 8.1
        - 7.1
        - 6.0
        required: true
        default: 16.0
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: https://github.com/grib24/android_device_realme_ussi_arm64
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: main
      DEVICE_PATH:
        description: Path the device tree should be synced to, relative to source root
        required: true
        default: device/realme/ussi_arm64
      DEVICE_NAME:
        description: Device Name from tree (should match name on twrp_<DEVICE_NAME>.mk)
        required: true
        default: latte
      REPOPICK_PATCHES:
        description: (Optional) Gerrit commit numbers separated by a space to be included in the build (leave blank if not using)
        type: string
        required: false
      BUILD_TARGET:
        type: choice
        description: Partition containing recovery ramdisk
        options:
        - boot
        - recovery
        - vendor_boot
        required: true
        default: vendor_boot
      RECOVERY_INSTALLER:
        description: Include recovery installer zip
        type: boolean
        required: true
        default: false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev \
          lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev \
          libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev \
          lzma ncftp qemu-user-static libtinfo5 python-is-python3
        sudo add-apt-repository universe
        sudo apt -y install libncurses5
        sudo ln -sf /usr/bin/python3 /usr/bin/python
 
    - name: Check Out
      uses: actions/checkout@v4
            
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Determine manifest
      id: manifest
      run: |
        case "${{ inputs.MANIFEST_BRANCH }}" in
          "16.0")
            echo "manifest_url=https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git" >> $GITHUB_OUTPUT
            echo "manifest_branch=twrp-16.0" >> $GITHUB_OUTPUT
            echo "build_type=aosp" >> $GITHUB_OUTPUT
            echo "release=bp2a" >> $GITHUB_OUTPUT
            ;;
          "14.1")
            echo "manifest_url=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git" >> $GITHUB_OUTPUT
            echo "manifest_branch=twrp-14.1" >> $GITHUB_OUTPUT
            echo "build_type=aosp" >> $GITHUB_OUTPUT
            echo "release=ap2a" >> $GITHUB_OUTPUT
            ;;
          "14.0")
            echo "manifest_url=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git" >> $GITHUB_OUTPUT
            echo "manifest_branch=twrp-14.0" >> $GITHUB_OUTPUT
            echo "build_type=aosp" >> $GITHUB_OUTPUT
            echo "release=ap2a" >> $GITHUB_OUTPUT
            ;;
          "12.1"|"11")
            echo "manifest_url=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git" >> $GITHUB_OUTPUT
            echo "manifest_branch=twrp-${{ inputs.MANIFEST_BRANCH }}" >> $GITHUB_OUTPUT
            echo "build_type=aosp" >> $GITHUB_OUTPUT
            echo "release=eng" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "manifest_url=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git" >> $GITHUB_OUTPUT
            echo "manifest_branch=twrp-${{ inputs.MANIFEST_BRANCH }}" >> $GITHUB_OUTPUT
            echo "build_type=omni" >> $GITHUB_OUTPUT
            echo "release=eng" >> $GITHUB_OUTPUT
            ;;
        esac

    - name: Install OpenJDK
      if: steps.manifest.outputs.build_type == 'omni'
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.manifest_url }} -b ${{ steps.manifest.outputs.manifest_branch }}
          
    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Create local manifest
      run: |
        mkdir -p .repo/local_manifests
        cat > .repo/local_manifests/latte.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project path="${{ inputs.DEVICE_PATH }}" name="$(echo ${{ inputs.DEVICE_TREE_URL }} | cut -d'/' -f4-5)" revision="${{ inputs.DEVICE_TREE_BRANCH }}" remote="github" />
        </manifest>
        EOF
        # Сначала синхронизируем все проекты, чтобы обновить кэш
        repo sync -j$(nproc --all)
        # Затем принудительно синхронизируем дерево устройств
        repo sync -j$(nproc --all) -f ${{ inputs.DEVICE_PATH }}
      working-directory: workspace

    - name: Fix device tree files
      run: |
        # Проверяем, что файлы существуют
        echo "📁 Checking device tree files..."
        ls -la device/realme/ussi_arm64/
        
        echo "✅ Device tree files check complete!"
      working-directory: workspace

    - name: Copy device tree to standard location
      run: |
        # Создаём стандартную структуру для устройства
        mkdir -p device/latte
        cp -r device/realme/ussi_arm64/* device/latte/
        
        # Исправляем пути в BoardConfig.mk для нового расположения
        sed -i 's|device/realme/ussi_arm64|device/latte|g' device/latte/BoardConfig.mk
        sed -i 's|device/realme/ussi_arm64|device/latte|g' device/latte/device.mk
        sed -i 's|device/realme/ussi_arm64|device/latte|g' device/latte/twrp_latte.mk
        
        echo "✅ Device tree copied to device/latte/"
        echo "📁 Files in device/latte/:"
        ls -la device/latte/
      working-directory: workspace

    - name: Copy dtb.img to device root
      run: |
        if [ -f device/latte/prebuilts/dtb.img ]; then
          cp device/latte/prebuilts/dtb.img device/latte/dtb.img
          echo "✅ dtb.img copied to device/latte/"
        else
          echo "❌ dtb.img not found in prebuilts!"
          exit 1
        fi
      working-directory: workspace

    - name: Copy dtb.img to output directory
      run: |
        # Создаём папку для вывода, если её нет
        mkdir -p out/target/product/latte
        # Копируем dtb.img в папку сборки
        if [ -f device/latte/dtb.img ]; then
          cp device/latte/dtb.img out/target/product/latte/dtb.img
          echo "✅ dtb.img copied to out/target/product/latte/"
        else
          echo "❌ dtb.img not found in device/latte/"
          exit 1
        fi
        ls -la out/target/product/latte/
      working-directory: workspace

    - name: Fix Android.bp
      run: |
        cat > device/latte/Android.bp << 'EOF'
        // SPDX-FileCopyrightText: The LineageOS Project
        // SPDX-License-Identifier: Apache-2.0
        
        // This is a minimal Android.bp for TWRP device tree
        // It defines the device as a subdir for build system
        
        subdirs = [
            "rootdir",
        ]
        
        // Include any additional subdirectories if needed
        // subdirs += ["prebuilts"]
        EOF
        echo "✅ Fixed Android.bp"
        cat device/latte/Android.bp
      working-directory: workspace

    - name: Fix vendor_boot configuration
      run: |
        # Добавляем настройки для сборки vendor_boot без ядра
        echo "" >> device/latte/BoardConfig.mk
        echo "# Vendor_boot configuration (no kernel, only dtb)" >> device/latte/BoardConfig.mk
        echo "TARGET_NO_KERNEL := true" >> device/latte/BoardConfig.mk
        echo "BOARD_KERNEL_IMAGE_NAME := dummy" >> device/latte/BoardConfig.mk
        echo "✅ Added vendor_boot configuration to BoardConfig.mk"
        
        # Проверяем, что настройки добавились
        echo "📁 Current BoardConfig.mk kernel settings:"
        grep -E "NO_KERNEL|KERNEL_IMAGE" device/latte/BoardConfig.mk || echo "Settings not found"
      working-directory: workspace

    - name: Fix 64-bit app support
      run: |
        # Добавляем флаг для поддержки 32-битных приложений
        echo "TARGET_SUPPORTS_64_BIT_APPS := false" >> device/latte/BoardConfig.mk
        echo "✅ Added TARGET_SUPPORTS_64_BIT_APPS := false to BoardConfig.mk"
        grep -A2 -B2 "64_BIT" device/latte/BoardConfig.mk || echo "Flag added"
      working-directory: workspace

    - name: Remove duplicate device tree
      run: |
        # Удаляем старое дерево устройств, чтобы избежать конфликта
        rm -rf device/realme/ussi_arm64
        echo "✅ Removed duplicate device tree at device/realme/ussi_arm64/"
        echo "📁 Remaining device trees:"
        ls -la device/
      working-directory: workspace

    - name: Refresh product list
      run: |
        source build/envsetup.sh
        echo "🔄 Refreshing product list..."
        # Принудительно обновляем кэш продуктов
        lunch twrp_latte-bp2a-eng 2>/dev/null || echo "⏳ Lunch will be retried later"
      working-directory: workspace
      continue-on-error: true

    - name: Repopick Gerrit patches
      if: inputs.REPOPICK_PATCHES != null
      run: |
        source build/envsetup.sh
        repopick -g https://gerrit.twrp.me ${{ inputs.REPOPICK_PATCHES }}
      working-directory: workspace
      continue-on-error: true

    - name: Include Recovery Installer
      if: inputs.RECOVERY_INSTALLER == true && inputs.MANIFEST_BRANCH != '6.0' && inputs.BUILD_TARGET != 'vendor_boot'
      run: |
        source build/envsetup.sh
        case ${{ inputs.MANIFEST_BRANCH }} in
          7.1)
            patchNum=5080
            ;;
          8.1)
            patchNum=5079
            ;;
          9.0)
            patchNum=5037
            ;;
          11)
            patchNum=4964
            ;;
          12.1)
            patchNum=5445
            ;;
        esac
        repopick -g https://gerrit.twrp.me ${patchNum}
      working-directory: workspace
      id: recoveryinstaller
      continue-on-error: true

    - name: Install Python 2
      if: steps.manifest.outputs.build_type == 'omni'
      run: |
        sudo apt -y install python2
        cd /usr/bin
        sudo ln -sf python2 python

    - name: Building recovery (AOSP)
      if: steps.manifest.outputs.build_type == 'aosp'
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export PLATFORM_VERSION=16
        
        if [ ${{ inputs.RECOVERY_INSTALLER }} = true ] && [ ${{ steps.recoveryinstaller.outcome == 'success' }} ]; then
          export USE_RECOVERY_INSTALLER=true
          export RECOVERY_INSTALLER_PATH=bootable/recovery/installer
        fi
        
        RELEASE="${{ steps.manifest.outputs.release }}"
        LUNCH_TARGET="twrp_${{ inputs.DEVICE_NAME }}-${RELEASE}-eng"
        
        echo "Trying lunch: $LUNCH_TARGET"
        if lunch $LUNCH_TARGET 2>/dev/null; then
          echo "✅ Lunch succeeded"
        else
          echo "Lunch failed, using direct make with TARGET_RELEASE..."
          export TARGET_PRODUCT=twrp_${{ inputs.DEVICE_NAME }}
          export TARGET_DEVICE=${{ inputs.DEVICE_NAME }}
          export TARGET_RELEASE=${RELEASE}
        fi
        
        echo "=== BUILDING RECOVERY ==="
        mka recoveryimage
        
        echo "=== BUILDING VENDOR_BOOT ==="
        mka vendorbootimage
        
        echo "=== CHECKING RESULTS ==="
        ls -la out/target/product/latte/ | grep -E "recovery|vendor_boot"
      working-directory: workspace

    - name: Building recovery (Omni)
      if: steps.manifest.outputs.build_type == 'omni'
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        
        if [ ${{ inputs.RECOVERY_INSTALLER }} = true ] && [ ${{ steps.recoveryinstaller.outcome == 'success' }} ]; then
          export USE_RECOVERY_INSTALLER=true
          export RECOVERY_INSTALLER_PATH=bootable/recovery/installer
        fi
        
        lunch ${{ steps.manifest.outputs.build_type }}_${{ inputs.DEVICE_NAME }}-eng && make ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: workspace

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: twrp_latte
        path: workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
        retention-days: 30

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
        name: ${{ inputs.DEVICE_NAME }} (TWRP)
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ inputs.MANIFEST_BRANCH }}
          Target: ${{ inputs.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.twrp }}
      continue-on-error: true
