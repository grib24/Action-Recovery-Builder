name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        type: choice
        description: Manifest Branch
        options:
        - 16.0
        - 14.1
        - 14.0
        - 12.1
        - 11
        - 9.0
        - 8.1
        - 7.1
        - 6.0
        required: true
        default: 16.0
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: https://github.com/grib24/android_device_realme_ussi_arm64
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: main
      DEVICE_PATH:
        description: Path the device tree should be synced to, relative to source root
        required: true
        default: device/realme/ussi_arm64
      DEVICE_NAME:
        description: Device Name from tree (should match name on twrp_<DEVICE_NAME>.mk)
        required: true
        default: latte
      REPOPICK_PATCHES:
        description: (Optional) Gerrit commit numbers separated by a space to be included in the build (leave blank if not using)
        type: string
        required: false
      BUILD_TARGET:
        type: choice
        description: Partition containing recovery ramdisk
        options:
        - boot
        - recovery
        - vendor_boot
        required: true
        default: vendor_boot
      RECOVERY_INSTALLER:
        description: Include recovery installer zip
        type: boolean
        required: true
        default: false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev \
          lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev \
          libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev \
          lzma ncftp qemu-user-static libtinfo5 python-is-python3
        sudo add-apt-repository universe
        sudo apt -y install libncurses5
        sudo ln -sf /usr/bin/python3 /usr/bin/python
 
    - name: Check Out
      uses: actions/checkout@v4
            
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Determine manifest
      id: manifest
      run: |
        case "${{ inputs.MANIFEST_BRANCH }}" in
          "16.0")
            echo "manifest_url=https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git" >> $GITHUB_OUTPUT
            echo "manifest_branch=twrp-16.0" >> $GITHUB_OUTPUT
            echo "build_type=aosp" >> $GITHUB_OUTPUT
            echo "release=bp2a" >> $GITHUB_OUTPUT
            ;;
          "14.1")
            echo "manifest_url=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git" >> $GITHUB_OUTPUT
            echo "manifest_branch=twrp-14.1" >> $GITHUB_OUTPUT
            echo "build_type=aosp" >> $GITHUB_OUTPUT
            echo "release=ap2a" >> $GITHUB_OUTPUT
            ;;
          "14.0")
            echo "manifest_url=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git" >> $GITHUB_OUTPUT
            echo "manifest_branch=twrp-14.0" >> $GITHUB_OUTPUT
            echo "build_type=aosp" >> $GITHUB_OUTPUT
            echo "release=ap2a" >> $GITHUB_OUTPUT
            ;;
          "12.1"|"11")
            echo "manifest_url=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git" >> $GITHUB_OUTPUT
            echo "manifest_branch=twrp-${{ inputs.MANIFEST_BRANCH }}" >> $GITHUB_OUTPUT
            echo "build_type=aosp" >> $GITHUB_OUTPUT
            echo "release=eng" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "manifest_url=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git" >> $GITHUB_OUTPUT
            echo "manifest_branch=twrp-${{ inputs.MANIFEST_BRANCH }}" >> $GITHUB_OUTPUT
            echo "build_type=omni" >> $GITHUB_OUTPUT
            echo "release=eng" >> $GITHUB_OUTPUT
            ;;
        esac

    - name: Install OpenJDK
      if: steps.manifest.outputs.build_type == 'omni'
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.manifest_url }} -b ${{ steps.manifest.outputs.manifest_branch }}
          
    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Create local manifest
      run: |
        mkdir -p .repo/local_manifests
        
        # Создаём roomservice.xml без remove-project
        cat > .repo/local_manifests/roomservice.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
            <remote name="TeamWin"
                    fetch="https://github.com/TeamWin"
                    review="https://gerrit.twrp.me"/>

            <remote name="LineageOS"
                    fetch="https://github.com/LineageOS"
                    review="https://review.lineageos.org"/>

            <remote name="TWRP-A16"
                    fetch="https://github.com/TWRP-Test"/>

            <remote name="github"
                    fetch="https://github.com"/>

            <!-- TWRP lives in TeamWin repo -->
            <project path="bootable/recovery" name="android_bootable_recovery" remote="TWRP-A16" revision="twrp-16.0"/>

            <!-- Use TeamWin repos for full recovery compatibility -->
            <project path="build/make" name="android_build" remote="TWRP-A16" revision="twrp-16.0">
                <linkfile src="CleanSpec.mk" dest="build/CleanSpec.mk" />
                <linkfile src="buildspec.mk.default" dest="build/buildspec.mk.default" />
                <linkfile src="core" dest="build/core" />
                <linkfile src="envsetup.sh" dest="build/envsetup.sh" />
                <linkfile src="target" dest="build/target" />
                <linkfile src="tools" dest="build/tools" />
            </project>
            <project path="build/soong" name="android_build_soong" remote="TWRP-A16" revision="twrp-16.0">
                <linkfile src="root.bp" dest="Android.bp" />
                <linkfile src="bootstrap.bash" dest="bootstrap.bash" />
            </project>
            <project path="bionic" name="android_bionic" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="cts" name="android_cts" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="external/icu" name="android_external_icu" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="external/libxml2" name="android_external_libxml2" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="external/sqlite" name="android_external_sqlite" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="external/libchrome" name="android_external_libchrome" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="external/zstd" name="android_external_zstd" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="frameworks/hardware/interfaces" name="android_frameworks_hardware_interfaces" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="hardware/interfaces" name="android_hardware_interfaces" remote="TWRP-A16" revision="twrp-16.0" />
            <project path="system/core" name="android_system_core" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="system/libhidl" name="android_system_libhidl" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="system/sepolicy" name="android_system_sepolicy" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="system/security" name="android_system_security" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="system/update_engine" name="android_system_update_engine" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="system/vold" name="android_system_vold" remote="TWRP-A16" revision="twrp-16.0"/>
            <project path="system/extras" name="android_system_extras" remote="TWRP-A16" revision="twrp-16.0"/>

            <!-- Use TeamWin custom vendor repo for build system -->
            <project path="vendor/twrp" name="android_vendor_twrp" remote="TWRP-A16" revision="twrp-16.0" />

            <!-- Include libmicrohttpd for TWRP -->
            <project name="android_external_libmicrohttpd" path="external/libmicrohttpd" remote="TWRP-A16" revision="twrp-16.0" />
            
            <!-- Include fake OMAPI for TWRP -->
            <project name="android_se_omapi" path="external/se_omapi" remote="TWRP-A16" revision="twrp-16.0" />

            <!-- Include phh's treble repo for lptools support -->
            <project name="phhusson/vendor_lptools" path="external/lptools" remote="github" revision="master" />

            <!-- Include external/bash for bash support -->
            <project path="external/bash" name="android_external_bash" remote="LineageOS" revision="lineage-22.2"/>

            <!-- Include external/libncurses for bash and nano support -->
            <project path="external/libncurses" name="android_external_libncurses" remote="LineageOS" revision="lineage-22.2"/>

            <!-- Include external/nano for nano support -->
            <project path="external/nano" name="android_external_nano" remote="LineageOS" revision="lineage-22.2"/>

            <!-- Include ntfs_3g for NTFS support -->
            <project path="external/ntfs-3g" name="android_external_ntfs-3g" remote="LineageOS" revision="lineage-22.2"/>

            <!-- Include lineage-tools for lzma support -->
            <project path="prebuilts/tools-lineage" name="android_prebuilts_tools-lineage" remote="LineageOS" revision="lineage-22.2"/>

            <!-- Include external Magisk repo for repack binaries -->
            <project path="external/magisk-prebuilt" name="external_magisk-prebuilt" remote="TeamWin" revision="android-12.1"/>

            <!-- Your device tree -->
            <project path="${{ inputs.DEVICE_PATH }}" name="$(echo ${{ inputs.DEVICE_TREE_URL }} | cut -d'/' -f4-5)" remote="github" revision="${{ inputs.DEVICE_TREE_BRANCH }}" />
        </manifest>
        EOF
        
        # Синхронизируем все проекты
        repo sync -j$(nproc --all)
      working-directory: workspace

    - name: Fix device tree files
      run: |
        # Проверяем, что файлы существуют
        echo "📁 Checking device tree files..."
        ls -la device/realme/ussi_arm64/
        
        # Исправляем AndroidProducts.mk
        cat > device/realme/ussi_arm64/AndroidProducts.mk << 'EOF'
        # SPDX-FileCopyrightText: The LineageOS Project
        # SPDX-License-Identifier: Apache-2.0

        PRODUCT_MAKEFILES := $(LOCAL_DIR)/twrp_latte.mk

        COMMON_LUNCH_CHOICES := \
            twrp_latte-eng \
            twrp_latte-userdebug \
            twrp_latte-user
        EOF
        
        # Проверяем наличие BoardConfig.mk
        if [ ! -f device/realme/ussi_arm64/BoardConfig.mk ]; then
          echo "❌ BoardConfig.mk not found! Creating it..."
          cat > device/realme/ussi_arm64/BoardConfig.mk << 'EOF'
        # SPDX-FileCopyrightText: The LineageOS Project
        # SPDX-License-Identifier: Apache-2.0

        DEVICE_PATH := device/realme/ussi_arm64

        # Architecture
        TARGET_ARCH := arm64
        TARGET_ARCH_VARIANT := armv8-a
        TARGET_CPU_ABI := arm64-v8a
        TARGET_CPU_VARIANT := generic

        TARGET_2ND_ARCH := arm
        TARGET_2ND_ARCH_VARIANT := armv8-a
        TARGET_2ND_CPU_ABI := armeabi-v7a
        TARGET_2ND_CPU_VARIANT := generic

        # Bootloader
        TARGET_BOOTLOADER_BOARD_NAME := ums9230_latte
        TARGET_NO_BOOTLOADER := true

        # Display
        TARGET_SCREEN_DENSITY := 320

        # Kernel Specs Configured for Realme C61 Stock (921600n8 console speed)
        BOARD_BOOT_HEADER_VERSION := 4
        BOARD_KERNEL_BASE := 0x00000000
        BOARD_KERNEL_CMDLINE := console=ttyS1,921600n8 bootconfig bootconfig
        BOARD_KERNEL_PAGESIZE := 4096
        BOARD_MKBOOTIMG_ARGS += --header_version $(BOARD_BOOT_HEADER_VERSION)

        # Prebuilt DTB Image configuration (Obligatory for vendor_boot Header v4)
        TARGET_FORCE_PREBUILT_KERNEL := false
        TARGET_PREBUILT_DTB := $(DEVICE_PATH)/dtb.img
        BOARD_INCLUDE_DTB_IN_BOOTIMG := true
        BOARD_MKBOOTIMG_ARGS += --dtb $(TARGET_PREBUILT_DTB)

        # Partitions
        BOARD_FLASH_BLOCK_SIZE := 262144
        BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 104857600

        # Recovery fstab
        TARGET_RECOVERY_FSTAB := $(DEVICE_PATH)/rootdir/etc/fstab.ums9230_latte

        # Platform
        TARGET_BOARD_PLATFORM := ums9230

        # Recovery Graphic Format for Unisoc Mali
        TARGET_RECOVERY_PIXEL_FORMAT := "BGRA_8888"
        TARGET_USERIMAGES_USE_EXT4 := true
        TARGET_USERIMAGES_USE_F2FS := true

        # Verified Boot
        BOARD_AVB_ENABLE := true
        BOARD_AVB_MAKE_VBMETA_IMAGE_ARGS += --flags 3

        # TWRP Configuration
        TW_THEME := portrait_hdpi
        TW_INPUT_BLACKLIST := "hbtp_vm"
        TW_SUPPORT_INPUT_AIDL := true
        TW_INCLUDE_CRYPTO := true
        TW_USE_FSCRYPT_POLICY := 2
        TW_INCLUDE_FASTBOOTD := true
        TW_EXCLUDE_DEFAULT_USB_INIT := true

        PLATFORM_VERSION := 16
        BUILD_BROKEN_MISSING_REQUIRED_MODULES := true
        EOF
          echo "✅ BoardConfig.mk created!"
        fi
        
        # Исправляем twrp_latte.mk
        cat > device/realme/ussi_arm64/twrp_latte.mk << 'EOF'
        # SPDX-FileCopyrightText: The LineageOS Project
        # SPDX-License-Identifier: Apache-2.0

        # Inherit from TWRP product core configuration
        $(call inherit-product, vendor/twrp/config/common.mk)

        # Inherit from device-specific configuration
        $(call inherit-product, device/realme/ussi_arm64/device.mk)

        # Product Details Configured for Realme C61 (latte)
        PRODUCT_DEVICE := latte
        PRODUCT_NAME := twrp_latte
        PRODUCT_BRAND := realme
        PRODUCT_MODEL := RMX3930
        PRODUCT_MANUFACTURER := realme

        PRODUCT_GMS_CLIENTID_BASE := android-realme

        # Official Russia Android 16 Fingerprint from ADB Telemetry
        PRODUCT_BUILD_PROP_OVERRIDES += \
            TARGET_DEVICE="RE6054" \
            PRODUCT_NAME="RMX3930RU" \
            TARGET_PRODUCT="RMX3930RU" \
            BUILD_FINGERPRINT="realme/RMX3930RU/RE6054:16/BP2A.250605.031.A3/U.1783691494:user/release-keys"
        EOF
        
        # Исправляем device.mk
        cat > device/realme/ussi_arm64/device.mk << 'EOF'
        # SPDX-FileCopyrightText: The LineageOS Project
        # SPDX-License-Identifier: Apache-2.0

        # Inherit from TWRP base configuration
        $(call inherit-product, vendor/twrp/config/common.mk)

        # Device specific configuration
        PRODUCT_COPY_FILES += \
            $(LOCAL_PATH)/rootdir/etc/fstab.ums9230_latte:$(TARGET_VENDOR_RAMDISK_OUT)/first_stage_ramdisk/fstab.ums9230_latte

        # Soong namespaces
        PRODUCT_SOONG_NAMESPACES += \
            $(LOCAL_PATH)
        EOF
        
        echo "✅ All device tree files fixed!"
        echo "📁 Files in device/realme/ussi_arm64/:"
        ls -la device/realme/ussi_arm64/
      working-directory: workspace

    - name: Copy device tree to standard location
      run: |
        # Создаём стандартную структуру для устройства
        mkdir -p device/latte
        cp -r device/realme/ussi_arm64/* device/latte/
        
        # Исправляем пути в BoardConfig.mk для нового расположения
        sed -i 's|device/realme/ussi_arm64|device/latte|g' device/latte/BoardConfig.mk
        sed -i 's|device/realme/ussi_arm64|device/latte|g' device/latte/device.mk
        sed -i 's|device/realme/ussi_arm64|device/latte|g' device/latte/twrp_latte.mk
        
        echo "✅ Device tree copied to device/latte/"
        echo "📁 Files in device/latte/:"
        ls -la device/latte/
      working-directory: workspace

    - name: Copy dtb.img to device root
      run: |
        if [ -f device/latte/prebuilts/dtb.img ]; then
          cp device/latte/prebuilts/dtb.img device/latte/dtb.img
          echo "✅ dtb.img copied to device/latte/"
        else
          echo "❌ dtb.img not found in prebuilts!"
          exit 1
        fi
      working-directory: workspace

    - name: Fix Android.bp
      run: |
        cat > device/latte/Android.bp << 'EOF'
        // SPDX-FileCopyrightText: The LineageOS Project
        // SPDX-License-Identifier: Apache-2.0
        
        // This is a minimal Android.bp for TWRP device tree
        // It defines the device as a subdir for build system
        
        subdirs = [
            "rootdir",
        ]
        
        // Include any additional subdirectories if needed
        // subdirs += ["prebuilts"]
        EOF
        echo "✅ Fixed Android.bp"
        cat device/latte/Android.bp
      working-directory: workspace

    - name: Fix vendor_boot configuration
      run: |
        # Добавляем настройки для сборки vendor_boot без ядра
        echo "" >> device/latte/BoardConfig.mk
        echo "# Vendor_boot configuration (no kernel, only dtb)" >> device/latte/BoardConfig.mk
        echo "TARGET_NO_KERNEL := true" >> device/latte/BoardConfig.mk
        echo "BOARD_KERNEL_IMAGE_NAME := dummy" >> device/latte/BoardConfig.mk
        echo "✅ Added vendor_boot configuration to BoardConfig.mk"
        
        # Проверяем, что настройки добавились
        echo "📁 Current BoardConfig.mk kernel settings:"
        grep -E "NO_KERNEL|KERNEL_IMAGE" device/latte/BoardConfig.mk || echo "Settings not found"
      working-directory: workspace

    - name: Fix 64-bit app support
      run: |
        # Добавляем флаг для поддержки 32-битных приложений
        echo "TARGET_SUPPORTS_64_BIT_APPS := false" >> device/latte/BoardConfig.mk
        echo "✅ Added TARGET_SUPPORTS_64_BIT_APPS := false to BoardConfig.mk"
        grep -A2 -B2 "64_BIT" device/latte/BoardConfig.mk || echo "Flag added"
      working-directory: workspace

    - name: Remove duplicate device tree
      run: |
        # Удаляем старое дерево устройств, чтобы избежать конфликта
        rm -rf device/realme/ussi_arm64
        echo "✅ Removed duplicate device tree at device/realme/ussi_arm64/"
        echo "📁 Remaining device trees:"
        ls -la device/
      working-directory: workspace

    - name: Refresh product list
      run: |
        source build/envsetup.sh
        echo "🔄 Refreshing product list..."
        # Принудительно обновляем кэш продуктов
        lunch twrp_latte-bp2a-eng 2>/dev/null || echo "⏳ Lunch will be retried later"
      working-directory: workspace
      continue-on-error: true

    - name: Repopick Gerrit patches
      if: inputs.REPOPICK_PATCHES != null
      run: |
        source build/envsetup.sh
        repopick -g https://gerrit.twrp.me ${{ inputs.REPOPICK_PATCHES }}
      working-directory: workspace
      continue-on-error: true

    - name: Include Recovery Installer
      if: inputs.RECOVERY_INSTALLER == true && inputs.MANIFEST_BRANCH != '6.0' && inputs.BUILD_TARGET != 'vendor_boot'
      run: |
        source build/envsetup.sh
        case ${{ inputs.MANIFEST_BRANCH }} in
          7.1)
            patchNum=5080
            ;;
          8.1)
            patchNum=5079
            ;;
          9.0)
            patchNum=5037
            ;;
          11)
            patchNum=4964
            ;;
          12.1)
            patchNum=5445
            ;;
        esac
        repopick -g https://gerrit.twrp.me ${patchNum}
      working-directory: workspace
      id: recoveryinstaller
      continue-on-error: true

    - name: Install Python 2
      if: steps.manifest.outputs.build_type == 'omni'
      run: |
        sudo apt -y install python2
        cd /usr/bin
        sudo ln -sf python2 python

    - name: Building recovery (AOSP)
      if: steps.manifest.outputs.build_type == 'aosp'
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export PLATFORM_VERSION=16
        
        if [ ${{ inputs.RECOVERY_INSTALLER }} = true ] && [ ${{ steps.recoveryinstaller.outcome == 'success' }} ]; then
          export USE_RECOVERY_INSTALLER=true
          export RECOVERY_INSTALLER_PATH=bootable/recovery/installer
        fi
        
        RELEASE="${{ steps.manifest.outputs.release }}"
        LUNCH_TARGET="twrp_${{ inputs.DEVICE_NAME }}-${RELEASE}-eng"
        
        echo "Trying lunch: $LUNCH_TARGET"
        if lunch $LUNCH_TARGET 2>/dev/null; then
          echo "Lunch succeeded, building..."
          make $(tr -d _ <<< ${{ inputs.BUILD_TARGET }})image -j$(nproc --all)
        else
          echo "Lunch failed, using direct make with TARGET_RELEASE..."
          export TARGET_PRODUCT=twrp_${{ inputs.DEVICE_NAME }}
          export TARGET_DEVICE=${{ inputs.DEVICE_NAME }}
          export TARGET_RELEASE=${RELEASE}
          make -j$(nproc --all) $(tr -d _ <<< ${{ inputs.BUILD_TARGET }})image
        fi
      working-directory: workspace

    - name: Building recovery (Omni)
      if: steps.manifest.outputs.build_type == 'omni'
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        
        if [ ${{ inputs.RECOVERY_INSTALLER }} = true ] && [ ${{ steps.recoveryinstaller.outcome == 'success' }} ]; then
          export USE_RECOVERY_INSTALLER=true
          export RECOVERY_INSTALLER_PATH=bootable/recovery/installer
        fi
        
        lunch ${{ steps.manifest.outputs.build_type }}_${{ inputs.DEVICE_NAME }}-eng && make ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: workspace

    - name: Upload to Release
      uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
      with:
        files: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*installer*zip
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/ramdisk-recovery.*
        name: ${{ inputs.DEVICE_NAME }} (TWRP)
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ inputs.MANIFEST_BRANCH }}
          Target: ${{ inputs.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
