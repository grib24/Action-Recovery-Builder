    - name: Fix device tree files
      run: |
        # Проверяем, что файлы существуют
        echo "📁 Checking device tree files..."
        ls -la device/realme/ussi_arm64/
        
        # Исправляем AndroidProducts.mk
        cat > device/realme/ussi_arm64/AndroidProducts.mk << 'EOF'
        # SPDX-FileCopyrightText: The LineageOS Project
        # SPDX-License-Identifier: Apache-2.0

        PRODUCT_MAKEFILES := $(LOCAL_DIR)/twrp_latte.mk

        COMMON_LUNCH_CHOICES := \
            twrp_latte-eng \
            twrp_latte-userdebug \
            twrp_latte-user
        EOF
        
        # Проверяем наличие BoardConfig.mk
        if [ ! -f device/realme/ussi_arm64/BoardConfig.mk ]; then
          echo "❌ BoardConfig.mk not found! Creating it..."
          cat > device/realme/ussi_arm64/BoardConfig.mk << 'EOF'
        # SPDX-FileCopyrightText: The LineageOS Project
        # SPDX-License-Identifier: Apache-2.0

        DEVICE_PATH := device/realme/ussi_arm64

        # Architecture
        TARGET_ARCH := arm64
        TARGET_ARCH_VARIANT := armv8-a
        TARGET_CPU_ABI := arm64-v8a
        TARGET_CPU_VARIANT := generic

        TARGET_2ND_ARCH := arm
        TARGET_2ND_ARCH_VARIANT := armv8-a
        TARGET_2ND_CPU_ABI := armeabi-v7a
        TARGET_2ND_CPU_VARIANT := generic

        # Bootloader
        TARGET_BOOTLOADER_BOARD_NAME := ums9230_latte
        TARGET_NO_BOOTLOADER := true

        # Display
        TARGET_SCREEN_DENSITY := 320

        # Kernel Specs Configured for Realme C61 Stock (921600n8 console speed)
        BOARD_BOOT_HEADER_VERSION := 4
        BOARD_KERNEL_BASE := 0x00000000
        BOARD_KERNEL_CMDLINE := console=ttyS1,921600n8 bootconfig bootconfig
        BOARD_KERNEL_PAGESIZE := 4096
        BOARD_MKBOOTIMG_ARGS += --header_version $(BOARD_BOOT_HEADER_VERSION)

        # Prebuilt DTB Image configuration (Obligatory for vendor_boot Header v4)
        TARGET_FORCE_PREBUILT_KERNEL := false
        TARGET_PREBUILT_DTB := $(DEVICE_PATH)/prebuilts/dtb.img
        BOARD_INCLUDE_DTB_IN_BOOTIMG := true
        BOARD_MKBOOTIMG_ARGS += --dtb $(TARGET_PREBUILT_DTB)

        # Partitions
        BOARD_FLASH_BLOCK_SIZE := 262144
        BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 104857600

        # Recovery fstab
        TARGET_RECOVERY_FSTAB := $(DEVICE_PATH)/rootdir/etc/fstab.ums9230_latte

        # Platform
        TARGET_BOARD_PLATFORM := ums9230

        # Recovery Graphic Format for Unisoc Mali
        TARGET_RECOVERY_PIXEL_FORMAT := "BGRA_8888"
        TARGET_USERIMAGES_USE_EXT4 := true
        TARGET_USERIMAGES_USE_F2FS := true

        # Verified Boot
        BOARD_AVB_ENABLE := true
        BOARD_AVB_MAKE_VBMETA_IMAGE_ARGS += --flags 3

        # TWRP Configuration
        TW_THEME := portrait_hdpi
        TW_INPUT_BLACKLIST := "hbtp_vm"
        TW_SUPPORT_INPUT_AIDL := true
        TW_INCLUDE_CRYPTO := true
        TW_USE_FSCRYPT_POLICY := 2
        TW_INCLUDE_FASTBOOTD := true
        TW_EXCLUDE_DEFAULT_USB_INIT := true

        PLATFORM_VERSION := 16
        BUILD_BROKEN_MISSING_REQUIRED_MODULES := true
        EOF
          echo "✅ BoardConfig.mk created!"
        fi
        
        # Исправляем twrp_latte.mk
        cat > device/realme/ussi_arm64/twrp_latte.mk << 'EOF'
        # SPDX-FileCopyrightText: The LineageOS Project
        # SPDX-License-Identifier: Apache-2.0

        # Inherit from TWRP product core configuration
        $(call inherit-product, vendor/twrp/config/common.mk)

        # Inherit from device-specific configuration
        $(call inherit-product, device/realme/ussi_arm64/device.mk)

        # Product Details Configured for Realme C61 (latte)
        PRODUCT_DEVICE := latte
        PRODUCT_NAME := twrp_latte
        PRODUCT_BRAND := realme
        PRODUCT_MODEL := RMX3930
        PRODUCT_MANUFACTURER := realme

        PRODUCT_GMS_CLIENTID_BASE := android-realme

        # Official Russia Android 16 Fingerprint from ADB Telemetry
        PRODUCT_BUILD_PROP_OVERRIDES += \
            TARGET_DEVICE="RE6054" \
            PRODUCT_NAME="RMX3930RU" \
            TARGET_PRODUCT="RMX3930RU" \
            BUILD_FINGERPRINT="realme/RMX3930RU/RE6054:16/BP2A.250605.031.A3/U.1783691494:user/release-keys"
        EOF
        
        # Исправляем device.mk
        cat > device/realme/ussi_arm64/device.mk << 'EOF'
        # SPDX-FileCopyrightText: The LineageOS Project
        # SPDX-License-Identifier: Apache-2.0

        # Inherit from TWRP base configuration
        $(call inherit-product, vendor/twrp/config/common.mk)

        # Device specific configuration
        PRODUCT_COPY_FILES += \
            $(LOCAL_PATH)/rootdir/etc/fstab.ums9230_latte:$(TARGET_VENDOR_RAMDISK_OUT)/first_stage_ramdisk/fstab.ums9230_latte

        # Soong namespaces
        PRODUCT_SOONG_NAMESPACES += \
            $(LOCAL_PATH)
        EOF
        
        echo "✅ All device tree files fixed!"
        echo "📁 Files in device/realme/ussi_arm64/:"
        ls -la device/realme/ussi_arm64/
      working-directory: workspace

    - name: Copy device tree to standard location
      run: |
        # Создаём стандартную структуру для устройства
        mkdir -p device/latte
        cp -r device/realme/ussi_arm64/* device/latte/
        
        # Исправляем пути в BoardConfig.mk для нового расположения
        sed -i 's|device/realme/ussi_arm64|device/latte|g' device/latte/BoardConfig.mk
        sed -i 's|device/realme/ussi_arm64|device/latte|g' device/latte/device.mk
        sed -i 's|device/realme/ussi_arm64|device/latte|g' device/latte/twrp_latte.mk
        
        echo "✅ Device tree copied to device/latte/"
        echo "📁 Files in device/latte/:"
        ls -la device/latte/
      working-directory: workspace

    - name: Refresh product list
      run: |
        source build/envsetup.sh
        echo "🔄 Refreshing product list..."
        # Принудительно обновляем кэш продуктов
        lunch twrp_latte-bp2a-eng 2>/dev/null || echo "⏳ Lunch will be retried later"
      working-directory: workspace
      continue-on-error: true
